name: Publicar no GitHub Pages

# Corre automaticamente sempre que há um push para "main". Sem isto, o
# GitHub Pages tenta servir o código-fonte tal como está (index.html a
# apontar para ficheiros .tsx que o browser não consegue executar
# diretamente) — e é exatamente isso que causa uma página em branco.
# Este workflow faz o "npm run build" que faltava, e publica só o
# resultado (a pasta dist/), que é HTML/CSS/JS normais.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Construir a app (npm run build)
        run: npm run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
